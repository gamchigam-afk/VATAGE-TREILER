<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VANTAGE — Trailer</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

body{
    font-family:"Noto Sans KR",Arial,sans-serif;
    color:#fff;
}

#trailer{
    position:relative;
    width:100%;
    height:100%;
    background:#000;
}

/* 영화 레터박스 */

.bar{
    position:absolute;
    left:0;
    width:100%;
    height:8%;
    background:#000;
    z-index:50;
    pointer-events:none;
}

.bar.top{
    top:0;
}

.bar.bottom{
    bottom:0;
}

/* 장면 */

.scene{
    position:absolute;
    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#000;

    opacity:0;
    visibility:hidden;

    transition:
        opacity .8s ease;
}

.scene.active{
    opacity:1;
    visibility:visible;
}

/* 대사 */

.dialogue{
    width:88%;

    text-align:center;

    font-size:clamp(21px,5vw,40px);

    font-weight:400;

    line-height:1.7;

    letter-spacing:2px;

    color:#eee;

    opacity:0;

    transform:translateY(12px);

    transition:
        opacity .8s ease,
        transform .8s ease;

    text-shadow:
        0 2px 20px rgba(255,255,255,.08);
}

.scene.active .dialogue{
    opacity:1;
    transform:translateY(0);
}

/* 로고 */

.logoScene{
    flex-direction:column;
}

.logo{
    font-family:Arial,sans-serif;

    font-size:clamp(55px,14vw,150px);

    font-weight:900;

    letter-spacing:14px;

    opacity:0;

    transform:scale(1.08);

    transition:
        opacity 1s ease,
        transform 1.2s ease;
}

.logoScene.active .logo{
    opacity:1;
    transform:scale(1);
}

.logoLine{
    width:100px;
    height:1px;

    background:#555;

    margin-top:20px;

    opacity:0;

    transition:
        opacity .8s ease .4s;
}

.logoScene.active .logoLine{
    opacity:1;
}

.logoSub{
    margin-top:16px;

    font-size:10px;

    letter-spacing:6px;

    color:#666;

    opacity:0;

    transition:
        opacity .8s ease .6s;
}

.logoScene.active .logoSub{
    opacity:1;
}

/* 암막 */

#blackout{
    position:absolute;
    inset:0;

    background:#000;

    z-index:100;

    opacity:1;

    pointer-events:none;

    transition:
        opacity .7s ease;
}

/* 시작 */

#start{
    position:absolute;
    inset:0;

    z-index:200;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#000;

    cursor:pointer;

    transition:
        opacity 1s ease;
}

.startText{
    font-size:13px;

    letter-spacing:6px;

    color:#fff;

    opacity:.65;

    animation:pulse 2s infinite;
}

@keyframes pulse{

    0%,100%{
        opacity:.25;
    }

    50%{
        opacity:.85;
    }
}

/* 마지막 */

#ending{
    position:absolute;
    inset:0;

    z-index:120;

    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;

    background:#000;

    opacity:0;
    pointer-events:none;

    transition:
        opacity 1.5s ease;
}

#ending.show{
    opacity:1;
}

.endLogo{
    font-family:Arial,sans-serif;

    font-size:clamp(55px,14vw,150px);

    font-weight:900;

    letter-spacing:14px;
}

.endText{
    margin-top:20px;

    font-size:10px;

    letter-spacing:7px;

    color:#555;
}
</style>
</head>

<body>

<div id="trailer">

    <!-- 1 -->
    <div class="scene" id="scene1">
        <div class="dialogue">
            반드시 날 구하러 올 거야..
        </div>
    </div>

    <!-- 2 -->
    <div class="scene" id="scene2">
        <div class="dialogue">
            내가 가겠소.
        </div>
    </div>

    <!-- 3 -->
    <div class="scene logoScene" id="scene3">

        <div class="logo">
            VANTAGE
        </div>

        <div class="logoLine"></div>

        <div class="logoSub">
            A NEW GENERATION OF FPS
        </div>

    </div>

    <!-- 4 -->
    <div class="scene" id="scene4">
        <div class="dialogue">
            우리는 반드시 돌아갈 수 있을 거라 믿었었소..
        </div>
    </div>

    <!-- 5 -->
    <div class="scene" id="scene5">
        <div class="dialogue">
            미안해요..
        </div>
    </div>

    <!-- 6 -->
    <div class="scene" id="scene6">
        <div class="dialogue">
            그 약속..
        </div>
    </div>

    <!-- 7 -->
    <div class="scene" id="scene7">
        <div class="dialogue">
            지키지 못할 것 같소..
        </div>
    </div>

    <!-- 8 -->
    <div class="scene" id="scene8">
        <div class="dialogue">
            그래도 한 가지는 약속하겠소.
        </div>
    </div>

    <!-- 9 -->
    <div class="scene" id="scene9">
        <div class="dialogue">
            절대로 당신을 잊지 않겠소.
        </div>
    </div>

    <!-- 10 -->
    <div class="scene" id="scene10">
        <div class="dialogue">
            내가 죽으면..
        </div>
    </div>

    <!-- 11 -->
    <div class="scene" id="scene11">
        <div class="dialogue">
            날 위해 울어주시오..
        </div>
    </div>

    <!-- 12 -->
    <div class="scene" id="scene12">
        <div class="dialogue">
            그리고 살아남으시오.
        </div>
    </div>

    <!-- 13 -->
    <div class="scene" id="scene13">
        <div class="dialogue">
            그것만이 내가 바라는 전부요.
        </div>
    </div>

    <!-- 14 -->
    <div class="scene" id="scene14">
        <div class="dialogue">
            다시 만날 그날까지..
        </div>
    </div>

    <!-- 15 -->
    <div class="scene" id="scene15">
        <div class="dialogue">
            부디.. 행복하시오.
        </div>
    </div>

    <!-- 암막 -->
    <div id="blackout"></div>

    <!-- 레터박스 -->
    <div class="bar top"></div>
    <div class="bar bottom"></div>

    <!-- 시작 -->
    <div id="start">
        <div class="startText">
            TAP TO BEGIN
        </div>
    </div>

    <!-- 엔딩 -->
    <div id="ending">

        <div class="endLogo">
            VANTAGE
        </div>

        <div class="endText">
            COMING SOON
        </div>

    </div>

</div>

<script>

const scenes = [

    {
        id:"scene1",
        time:1800
    },

    {
        id:"scene2",
        time:1800
    },

    {
        id:"scene3",
        time:3000
    },

    {
        id:"scene4",
        time:2000
    },

    {
        id:"scene5",
        time:1600
    },

    {
        id:"scene6",
        time:1600
    },

    {
        id:"scene7",
        time:2000
    },

    {
        id:"scene8",
        time:1800
    },

    {
        id:"scene9",
        time:2000
    },

    {
        id:"scene10",
        time:1700
    },

    {
        id:"scene11",
        time:2300
    },

    {
        id:"scene12",
        time:1800
    },

    {
        id:"scene13",
        time:1900
    },

    {
        id:"scene14",
        time:2000
    },

    {
        id:"scene15",
        time:2800
    }

];

let current = -1;
let playing = false;

const blackout =
    document.getElementById("blackout");

const start =
    document.getElementById("start");

const ending =
    document.getElementById("ending");


/* 암막 */

function fadeBlack(){

    blackout.style.opacity = "1";

}


/* 암막 해제 */

function fadeOpen(){

    blackout.style.opacity = "0";

}


/* 장면 표시 */

function showScene(index){

    document
        .querySelectorAll(".scene")
        .forEach(scene => {

            scene.classList.remove("active");

        });

    const target =
        document.getElementById(
            scenes[index].id
        );

    target.classList.add("active");
}


/* 다음 장면 */

function nextScene(){

    current++;

    if(current >= scenes.length){

        finishTrailer();

        return;
    }

    /* 먼저 암막 */

    fadeBlack();

    setTimeout(() => {

        /* 다음 장면 */

        showScene(current);

        /* 천천히 밝아짐 */

        setTimeout(() => {

            fadeOpen();

        },150);

        /* 장면 유지 */

        setTimeout(() => {

            nextScene();

        },scenes[current].time);

    },700);
}


/* 시작 */

function startTrailer(){

    if(playing) return;

    playing = true;

    start.style.opacity = "0";

    setTimeout(() => {

        start.style.display = "none";

    },1000);

    setTimeout(() => {

        nextScene();

    },700);
}


/* 종료 */

function finishTrailer(){

    fadeBlack();

    setTimeout(() => {

        document
            .querySelectorAll(".scene")
            .forEach(scene => {

                scene.classList.remove("active");

            });

        ending.classList.add("show");

        setTimeout(() => {

            fadeOpen();

        },500);

    },800);
}


/* 클릭 */

start.addEventListener(
    "click",
    startTrailer
);


/* 터치 */

start.addEventListener(
    "touchstart",
    startTrailer
);


/* 키보드 */

document.addEventListener(
    "keydown",
    event => {

        if(
            event.code === "Space" ||
            event.code === "Enter"
        ){

            startTrailer();

        }

    }
);

</script>

</body>
</html>
